name: Daily Research

on:
  schedule:
    # 09:00 Asia/Taipei == 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Force a specific topic (optional)"
        required: false
      force_update:
        description: "Overwrite an existing same-day report"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (no commit/push)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  # Without the ANTHROPIC_API_KEY secret this workflow skips cleanly (green):
  # the Claude cloud routine handles daily publishing in that case, and we
  # must never publish mock data. Setting the secret activates this job.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY secret is not set — skipping (the Claude cloud routine publishes the daily report)"
          fi

  research:
    needs: preflight
    if: needs.preflight.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure git author
        run: |
          git config user.name "research-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          FORCE_UPDATE: ${{ inputs.force_update == true && 'true' || 'false' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.topic }}" ]; then
            ARGS="--topic \"${{ inputs.topic }}\""
          fi
          eval npm run daily -- $ARGS
