name: Daily Research

on:
  schedule:
    # 09:00 Asia/Taipei == 01:00 UTC
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Force a specific topic (optional)"
        required: false
      force_update:
        description: "Overwrite an existing same-day report"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (no commit/push)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set — refusing to run with mock data"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Configure git author
        run: |
          git config user.name "research-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          FORCE_UPDATE: ${{ inputs.force_update == true && 'true' || 'false' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.topic }}" ]; then
            ARGS="--topic \"${{ inputs.topic }}\""
          fi
          eval npm run daily -- $ARGS
